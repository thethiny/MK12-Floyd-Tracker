<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floyd Tracker</title>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Floyd Tracker">
    <meta property="og:description" content="A tool to check your floyd progress. Hopefully it helps you find him faster">
    <meta property="og:image" content="https://floydtracker.thethiny.xyz/assets/floyd_og.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://floydtracker.thethiny.xyz">
    <link rel="icon" href="assets/PinkFloyd-Square.png" type="image/png">

    <link rel="stylesheet" href="css/style.css?07-11-26_01">
    <link rel="stylesheet" href="css/index.css?07-11-26_01">

    <script defer src="js/navbar.js?07-11-26_01"></script>
</head>

<body>
    <aside class="sidebar" id="history-sidebar">
        <div class="sidebar-header">
            <h2>History</h2>
            <button class="toggle-sidebar inside" id="toggle-sidebar-inside" aria-label="Close history">✕</button>
        </div>
        <ul id="history-list"></ul>
        <button class="button clear-history" id="clear-history">Clear All</button>
    </aside>

    <main class="page search-page">
        <div class="logo" role="img" aria-label="Find Floyd"></div>

        <div class="card search-card">
            <div class="search-login-row">
                <input type="text" id="username" class="text-input" placeholder="Enter username" autocomplete="off">
                <button class="button login-btn" id="login" style="display: none;">Login</button>
            </div>

            <div class="platforms" id="platforms"></div>

            <div class="platform-info">
                <p id="selected-platform" class="selected-platform">No platform selected</p>
                <p id="platform-description" class="platform-description">Select a platform to see details</p>
            </div>

            <div class="buttons-container">
                <button class="button button-primary track-btn" id="track">Track</button>
                <button class="button track-btn" id="toggle-sidebar-outside">History</button>
            </div>
            <p id="error-message" class="error-message"></p>
        </div>

        <div class="credits">
            <p>Maintained by <a href="https://twitter.com/thethiny" target="_blank">@thethiny on Twitter/X</a></p>
            <p>Special thanks to <a href="https://twitter.com/interloko" target="_blank">@Interloko</a> and <a href="https://twitter.com/nugiuk" target="_blank">@NugiUK</a> and the entire Twitter/X community for their help and feedback</p>
        </div>

        <div class="kofi-section">
            <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script><script type='text/javascript'>kofiwidget2.init('Want to Support me?', '#C46788', 'D1D219Y0XH');kofiwidget2.draw();</script>
        </div>

        <p class="credits privacy-link"><a href="/privacy">Privacy Policy</a></p>
    </main>

    <div class="loading-overlay" id="loading"><div class="loading-spinner"></div></div>

    <script src="js/history.js?06-04-25_01"></script>
    <script src="js/platforms.js?03-06-26_01_01"></script>
    <script src="js/config.js?07-11-26_01"></script>
    <script src="js/id.js?07-11-26_01"></script>
</body>
</html>
